<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;700&display=block" rel="stylesheet">
<style>
  /* Rendered at exactly 2500x1686 by scripts/richmenu/render.ps1. The 3x2
     tile grid must line up with the tap areas in setup.mjs. */
  html, body { margin: 0; width: 2500px; height: 1686px; overflow: hidden; }
  body {
    background: #E6F0F7;
    font-family: 'IBM Plex Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
    display: grid;
    grid-template-columns: 833px 834px 833px;
    grid-template-rows: 843px 843px;
  }
  .cell { padding: 26px; box-sizing: border-box; }
  .tile {
    height: 100%;
    border-radius: 56px;
    background: #FFFFFF;
    box-shadow: 0 10px 0 rgba(11, 99, 148, 0.10);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }
  .icon {
    width: 250px; height: 250px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Segoe UI Emoji', sans-serif;
    font-size: 150px;
    margin-bottom: 14px;
  }
  .label { font-size: 92px; font-weight: 700; color: #16324A; line-height: 1.15; }
  .sub { font-size: 50px; font-weight: 500; color: #6B7F90; line-height: 1.2; }

  .hero { background: #0B6394; box-shadow: 0 10px 0 rgba(11, 99, 148, 0.30); }
  .hero .label { color: #FFFFFF; }
  .hero .sub { color: #CFE6F5; }
  .hero .icon { background: rgba(255, 255, 255, 0.16); }

  .sky .icon { background: #DDEFFB; }
  .amber .icon { background: #FDEFD3; }
  .violet .icon { background: #ECE5FB; }
  .green .icon { background: #DDF3E4; }
  .slate .icon { background: #E6EBF0; }
</style>
</head>
<body>
  <div class="cell"><div class="tile sky">
    <div class="icon">📱</div><div class="label">เปิดแอพ ThaiTax</div><div class="sub">หน้าหลักของแอพ</div>
  </div></div>
  <div class="cell"><div class="tile hero">
    <div class="icon">🛡️</div><div class="label">บันทึกประกัน</div><div class="sub">เลือกประเภท แล้วกรอกได้เลย</div>
  </div></div>
  <div class="cell"><div class="tile amber">
    <div class="icon">🔔</div><div class="label">แจ้งเตือนของฉัน</div><div class="sub">กำหนดการที่กำลังจะมาถึง</div>
  </div></div>
  <div class="cell"><div class="tile violet">
    <div class="icon">🧾</div><div class="label">ลดหย่อนภาษี</div><div class="sub">เช็คสิทธิที่ยังใช้ได้</div>
  </div></div>
  <div class="cell"><div class="tile green">
    <div class="icon">🌱</div><div class="label">สวนต้นไม้ภาษี</div><div class="sub">รดน้ำ ทำเควส สะสมแต้ม</div>
  </div></div>
  <div class="cell"><div class="tile slate">
    <div class="icon">🆔</div><div class="label">ขอ User ID</div><div class="sub">สำหรับเชื่อมต่อบัญชี</div>
  </div></div>
</body>
</html>
